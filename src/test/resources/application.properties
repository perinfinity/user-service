# Test Configuration
server.port=0

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Flyway disabled for tests — JPA create-drop handles schema
spring.flyway.enabled=false

# Disable Spring SQL init — data.sql is not needed in tests
spring.sql.init.mode=never

# JWT Configuration
jwt.secret.key=test_secret_key_for_testing_only
jwt.expiration=3600000

# Email Configuration (disabled for tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
app.mail.from=Je Suis Utile <no-reply@test.local>



