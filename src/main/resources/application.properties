server.port=8080

# Secrets locaux (git-ignoré) — ex : RESEND_API_KEY pour l'envoi de mails en dev
spring.config.import=optional:file:./.env.properties

spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

## Hibernate properties
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

## Flyway — schema migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

## Disable Spring SQL init — Flyway manages schema and seed data
spring.sql.init.mode=never

jwt.secret.key=${JWT_SECRET_KEY:dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nX29ubHk}
# 1h in millisecond
jwt.expiration=3600000

# Cookie — set Secure=true in production (HTTPS required)
app.cookie.secure=${COOKIE_SECURE:false}

# Email Configuration — Resend SMTP par défaut (https://resend.com/docs/send-with-smtp)
# Le mot de passe SMTP est la clé API Resend (RESEND_API_KEY, fournie via .env.properties en dev)
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:${RESEND_API_KEY:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Expéditeur — doit appartenir à un domaine vérifié dans Resend
app.mail.from=${MAIL_FROM:Je Suis Utile <no-reply@mail.perinfinity.com>}

# URL publique du frontend (liens dans les emails)
app.base-url=${APP_BASE_URL:http://localhost:4200}

# Clé partagée des endpoints internes (fournie via .env.properties en dev ; vide = endpoints désactivés)
internal.api.key=${INTERNAL_API_KEY:}

