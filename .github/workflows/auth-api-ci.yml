name: auth-api CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        run: mvn clean install --batch-mode
        env:
          # src/test/resources/application.properties already provides safe defaults.
          # This secret overrides them if configured in the repo settings.
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'dGVzdC1zZWNyZXQta2V5LWZvci1hdXRoLWFwaS1jaS10ZXN0aW5nLW9ubHk=' }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-api-jar
          path: target/auth-api-*.jar
          retention-days: 7
